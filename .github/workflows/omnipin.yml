name: Deploy to IPFS + ENS via Omnipin

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    # Skip if OMNIPIN_ENS variable isn't set
    if: vars.OMNIPIN_ENS != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # dApp (gallery + /claim hub): the client WalletConnect projectId must be
      # inlined at build time. It is public, so it lives in a repo variable.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ vars.NEXT_PUBLIC_ALCHEMY_API_KEY }}

      - name: Install Omnipin
        run: npm i -g omnipin@3.0.0

      - name: Deploy to IPFS and update ENS contenthash
        run: |
          SAFE_FLAG=""
          if [ -n "${{ vars.OMNIPIN_SAFE }}" ]; then
            SAFE_FLAG="--safe ${{ vars.OMNIPIN_SAFE }}"
          fi
          omnipin deploy ./out --strict --ens "${{ vars.OMNIPIN_ENS }}" $SAFE_FLAG
        env:
          OMNIPIN_PINATA_TOKEN: ${{ secrets.OMNIPIN_PINATA_TOKEN }}
          OMNIPIN_LIGHTHOUSE_TOKEN: ${{ secrets.OMNIPIN_LIGHTHOUSE_TOKEN }}
          OMNIPIN_4EVERLAND_TOKEN: ${{ secrets.OMNIPIN_4EVERLAND_TOKEN }}
          OMNIPIN_PK: ${{ secrets.OMNIPIN_PK }}
